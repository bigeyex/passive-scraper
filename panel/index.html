<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passive Scraper</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="control-panel">
                <button id="play-btn" class="icon-btn" title="Start/Stop Listening">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path id="play-icon" d="M8 5v14l11-7z" />
                        <path id="stop-icon" d="M6 6h12v12H6z" style="display: none;" />
                    </svg>
                </button>
            </div>
            <nav class="nav-menu">
                <button class="nav-item active" data-tab="plan">Plan</button>
                <div class="nav-divider">Tables</div>
                <div id="tables-nav-container">
                    <!-- Table tabs will be added here dynamically -->
                </div>
            </nav>
        </aside>
        <main class="content-area">
            <div id="plan-tab" class="tab-content active">
                <div class="header">
                    <h2>Scraping Plan</h2>
                    <button id="add-request-btn" class="primary-btn">+ Add Request</button>
                </div>
                <div id="plan-container">
                    <!-- Request blocks will be added here -->
                </div>
            </div>
            <div id="tables-container">
                <!-- Table views will be added here dynamically -->
            </div>
        </main>
        <aside class="log-sidebar" id="log-sidebar">
            <div class="log-header">
                <h3>Activity Log</h3>
                <button id="clear-log-btn" class="icon-btn" title="Clear Log">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                    </svg>
                </button>
            </div>
            <div id="log-container"></div>
        </aside>
        <button id="log-toggle-btn" class="icon-btn" title="Toggle Logs">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path
                    d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
            </svg>
        </button>
    </div>
    <script src="main.js"></script>
</body>

</html>
